[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragbooster"
version = "2.0.0"
description = "Zero-heavy-dependency, LLM-agnostic RAG: BM25 retrieval + a universal LLM client. Use as a Python library or as an HTTP service."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daouda Abdoul Anzize" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",   # required by fastapi.testclient
]

[project.scripts]
ragbooster = "ragbooster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbooster"]
