services:
  ragbooster:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ragbooster-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  ragbooster-data:
